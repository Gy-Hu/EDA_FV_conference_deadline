# Maintainer-owned labels. Values live in each conference's `labels` field.
# Color endpoints are display conventions, not researched facts.
- key: no_in_person
  label: Remote / Optional Attendance
  kind: boolean
  color: blue
  description: At least one paper track allows remote or optional attendance, including arrangements requiring organizer approval. Conditions may vary by track.
- key: registration_fee
  label: Registration Fee
  kind: fee
  description: Registration fees available to non-student authors, including ordinary academic rates. Lower fees are greener; higher fees are redder. Eligibility and early or online rates may apply.
  # Independent display ranges, NOT exchange rates or a claim of affordability.
  # Unsupported currencies display in neutral gray until a range is configured.
  scales:
    USD: {min: 0, max: 1000}
    CAD: {min: 0, max: 1500}
    AUD: {min: 0, max: 1500}
    SGD: {min: 0, max: 1500}
    EUR: {min: 0, max: 1000}
    GBP: {min: 0, max: 1000}
    CNY: {min: 0, max: 7000}
    HKD: {min: 0, max: 8000}
    JPY: {min: 0, max: 150000}
- key: submissions
  label: Submissions
  kind: number
  unit: papers
  description: Submission volume for the indicated year and scope. Lower counts are greener; higher counts are redder.
  scale: {min: 0, max: 1000}
- key: acceptance_rate
  label: Acceptance Rate
  kind: number
  unit: '%'
  description: Acceptance rate for the indicated year and scope, excluding Findings. Verified overall totals are preferred; track-specific or committed-paper counts may be used when necessary. Lower rates are redder; higher rates are greener.
  scale: {min: 0, max: 100, reverse: true, bands: 21}
- key: tool_paper
  label: Tool paper · Proceedings
  kind: boolean
  color: purple
  requires_proceedings: true
  requires_main_proceedings: true
  allowed_submission_types: [tool_paper, system_description, demo_paper, competition_tool_paper]
  description: An explicitly defined tool paper, system description or demo paper submission category with archival proceedings. Regular research merely welcoming tool-related work does not qualify. Competition entries may have eligibility restrictions.
- key: short_paper
  label: Short paper · Proceedings
  kind: boolean
  color: amber
  requires_proceedings: true
  requires_main_proceedings: true
  requires_direct_submission: true
  compact_page_limits: {two_column: 4, one_column: 8}
  description: Direct submissions with verified proceedings qualify if they are a short/brief paper category or use at most four two-column content pages or eight single-column content pages, even without a separate Short track. Reference-only extra pages are noted in the source details. Downgrade-only short papers and non-archival abstracts do not qualify.
- key: core_ranking
  label: CORE
  kind: ranking
  color: slate
  options: ['A*', 'A', 'B', 'C', 'Unranked']
  colors: {'A*': red, A: orange, B: amber, C: green, Unranked: slate}
  description: CORE conference ranking, from A* (highest) through A, B and C. Higher ranks are redder; lower ranks are greener. Confirmed Unranked entries are gray.
- key: ccf_ranking
  label: CCF
  kind: ranking
  color: slate
  options: ['A', 'B', 'C', 'Unranked']
  colors: {A: red, B: amber, C: green, Unranked: slate}
  description: CCF conference ranking, from A (highest) through B and C. Higher ranks are redder; lower ranks are greener. Confirmed Unranked entries are gray. Rankings apply to full/regular papers and do not automatically cover tool, short or demo papers.
